<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Right Panel Test</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--zizai-color-text, #1e293b);
      background: var(--zizai-color-background, #fff);
    }

    .test-layout {
      display: flex;
      gap: 16px;
      height: 480px;
    }

    .test-controls {
      flex: 1;
      padding: 16px;
      border: 1px solid var(--zizai-color-border, #e2e8f0);
    }

    .right-panel-wrapper {
      width: 360px;
      height: 100%;
    }

    #test-report {
      margin-top: 16px;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Right Panel Test</h1>
  <div class="test-layout">
    <div class="test-controls">
      <button id="run-tests" type="button">Run tests</button>
      <div id="test-report" aria-live="polite"></div>
    </div>
    <div class="right-panel-wrapper">
      <zizai-right-panel id="right-panel"></zizai-right-panel>
    </div>
  </div>

  <script type="module">
    import './zizai-right-panel.js';

    const panel = document.getElementById('right-panel');
    const report = document.getElementById('test-report');
    const mockData = [
      { id: 'test-a', label: 'Test A', content: 'Content A' },
      { id: 'test-b', label: 'Test B', content: 'Content B' },
      { id: 'test-c', label: 'Test C', content: 'Content C' }
    ];

    function runTests() {
      const results = [];
      const assert = (condition, name) => {
        results.push(`${condition ? 'PASS' : 'FAIL'}: ${name}`);
      };

      panel.setWorkspaces(mockData);
      panel.setFavorites(['test-a']);
      assert(panel.getActiveWorkspace() === 'test-a', 'initial active workspace');
      assert(panel.getAttribute('active-id') === 'test-a', 'initial active-id synchronization');

      const select = panel.shadowRoot.querySelector('#workspace-select');
      select.value = 'test-b';
      select.dispatchEvent(new Event('change', { bubbles: true }));
      assert(panel.getActiveWorkspace() === 'test-b', 'workspace selection');
      assert(panel.getAttribute('active-id') === 'test-b', 'selection updates active-id');

      const favorite = panel.shadowRoot.querySelector('.favorite-chip');
      favorite.click();
      assert(panel.getActiveWorkspace() === 'test-a', 'favorite selection');

      panel.setAttribute('active-id', 'test-c');
      assert(panel.getActiveWorkspace() === 'test-c', 'external active-id synchronization');
      assert(select.value === 'test-c', 'active-id synchronizes select');
      assert(panel.getFavorites()[0] === 'test-a', 'favorites state');

      report.textContent = results.join('\n');
    }

    document.getElementById('run-tests').addEventListener('click', runTests);
    runTests();
  </script>
</body>
</html>
