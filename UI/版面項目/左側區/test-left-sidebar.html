<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>ZIZAI 左側區 V1 驗證</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; display: flex; height: 100vh; overflow: hidden; }
    .layout { display: flex; width: 100%; height: 100%; }
    .main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .desc { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
    .desc h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .desc p { margin: 0; font-size: 0.85rem; color: #4b5563; }
    .log { flex: 1; padding: 16px 24px; background: #1f2937; color: #f3f4f6; font-family: monospace; font-size: 0.85rem; overflow-y: auto; white-space: pre-wrap; }
    .success { color: #34d399; font-weight: bold; }
  </style>
  <script src="../../通用框架項目/事件處理/zizai-events.js"></script>
  <script src="./zizai-left-sidebar.js"></script>
</head>
<body>
  <div class="layout">
    <zizai-left-sidebar id="test-sidebar"></zizai-left-sidebar>
    <div class="main">
      <div class="desc">
        <h2>左側區元件驗證 (Left Sidebar V1)</h2>
        <p>驗證：整體收合、五個項目獨立開合、公開方法 toggleSidebar、事件通訊。</p>
      </div>
      <div class="log" id="log-output">[系統] 等待驗證...\n</div>
    </div>
  </div>

  <script>
    const logOutput = document.getElementById('log-output');
    function log(msg, isSuccess) {
      const cls = isSuccess ? 'success' : '';
      logOutput.innerHTML += '<span class="' + cls + '">' + msg + '</span>\n';
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    const sidebar = document.getElementById('test-sidebar');
    let passedCount = 0;

    sidebar.addEventListener('zizai-sidebar-toggle', function(e) {
      log('[整體事件] collapsed: ' + (e.detail && e.detail.data && e.detail.data.collapsed), true);
      passedCount++;
    });

    sidebar.addEventListener('zizai-sidebar-section-toggle', function(e) {
      const d = e.detail && e.detail.data;
      log('[子項目事件] section: ' + (d && d.section) + ', isOpen: ' + (d && d.isOpen));
      passedCount++;
    });

    setTimeout(function() {
      log('-> 模擬點擊「連線狀態」收合...');
      const header = sidebar.shadowRoot.querySelector('[data-target="connection"]');
      if (header) header.click();
    }, 400);

    setTimeout(function() {
      log('-> 模擬點擊「連線狀態」再展開...');
      const header = sidebar.shadowRoot.querySelector('[data-target="connection"]');
      if (header) header.click();
    }, 800);

    setTimeout(function() {
      log('-> 呼叫 toggleSidebar() 收合整體...');
      sidebar.toggleSidebar();
    }, 1200);

    setTimeout(function() {
      log('-> 再次呼叫 toggleSidebar() 展開...');
      sidebar.toggleSidebar();
    }, 1600);

    setTimeout(function() {
      if (passedCount >= 4) {
        log('=== 最終結果: PASSED ===', true);
      } else {
        log('=== 最終結果: FAILED (事件數: ' + passedCount + ') ===', false);
      }
    }, 2000);
  </script>
</body>
</html>
