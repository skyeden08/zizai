<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIZAI · 主體</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F6F63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F6F4EE;
    --paper-dim:#EDEAE1;
    --panel:#FBFAF6;
    --ink:#23262B;
    --ink-soft:#6B6F76;
    --line:#D9D4C7;
    --jade:#3F6F63;
    --jade-dim:#E4ECE9;
    --jade-deep:#2C544B;
    --warn:#B5542D;
    --serif:'Noto Serif TC', serif;
    --sans:'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    height:52px;
    flex:0 0 auto;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:var(--serif);
    font-weight:700;
    font-size:18px;
    letter-spacing:.02em;
  }
  .brand .tag{
    font-size:12px;
    color:var(--ink-soft);
  }
  .status{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .status .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--line);
    display:inline-block;
    margin-right:5px;
  }
  .status .dot.on{ background:var(--jade); }
  .status .dot.err{ background:var(--warn); }
  #signinBtn{
    display:flex;
    align-items:center;
  }
  .userchip{
    display:none;
    align-items:center;
    gap:8px;
    font-size:12px;
  }
  .userchip img{
    width:22px; height:22px; border-radius:50%;
  }
  .btn-ghost{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--sans);
    font-size:12px;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--jade); color:var(--jade-deep); }

  /* ---------- layout ---------- */
  .layout{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  .panel{
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
    transition:flex-basis .15s ease;
  }
  .panel-head{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{
    font-family:var(--serif);
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:.03em;
  }
  .fold-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1;
    padding:2px 4px;
  }
  .fold-btn:hover{ color:var(--jade-deep); }
  .panel-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:14px 16px;
  }

  #aux{ flex:0 0 240px; background:var(--paper-dim); }
  #chat{ flex:1 1 auto; background:var(--paper); border-left:1px solid var(--line); border-right:1px solid var(--line); }
  #view{ flex:0 0 320px; background:var(--paper-dim); }

  .panel.collapsed{ flex:0 0 40px !important; }
  .panel.collapsed .panel-body{ display:none; }
  .panel.collapsed .panel-head h2{ display:none; }
  .panel.collapsed .panel-head{ justify-content:center; }

  .resizer{
    flex:0 0 5px;
    cursor:col-resize;
    background:transparent;
    position:relative;
  }
  .resizer::after{
    content:'';
    position:absolute;
    top:0; bottom:0; left:2px;
    width:1px;
    background:var(--line);
  }
  .resizer:hover::after, .resizer.active::after{ background:var(--jade); width:2px; left:1.5px;}

  /* ---------- 輔助區 (log) ---------- */
  .log-item{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.6;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
  }
  .log-item time{
    display:block;
    font-size:10px;
    color:#9A968A;
  }

  /* ---------- 對話區 (chat) ---------- */
  #chatScroll{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:9px 13px;
    border-radius:8px;
    font-size:13.5px;
    line-height:1.65;
    white-space:pre-wrap;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--jade);
    color:#fff;
    border-bottom-right-radius:2px;
  }
  .bubble.ai{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:2px;
  }
  .chat-input-bar{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .chat-input-bar textarea{
    flex:1;
    resize:none;
    height:42px;
    font-family:var(--sans);
    font-size:13.5px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    background:var(--paper);
    color:var(--ink);
  }
  .chat-input-bar textarea:focus{
    outline:none;
    border-color:var(--jade);
  }
  .chat-input-bar button{
    font-family:var(--sans);
    font-weight:500;
    font-size:13px;
    background:var(--jade);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:0 18px;
    cursor:pointer;
  }
  .chat-input-bar button:hover{ background:var(--jade-deep); }

  /* ---------- 共視區 (result cards) ---------- */
  .result-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .result-card h3{
    font-family:var(--serif);
    font-size:12.5px;
    font-weight:600;
    margin-bottom:5px;
  }
  .result-card p{
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .empty-hint{
    font-size:12px;
    color:#A8A398;
    text-align:center;
    padding:30px 10px;
    line-height:1.8;
  }

  ::-webkit-scrollbar{ width:7px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:760px){
    #aux, #view{ display:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="mark">ZIZAI</span>
      <span class="tag">主體 · 自在</span>
    </div>
    <div class="status">
      <span id="driveStatus"><span class="dot" id="driveDot"></span>雲端未連線</span>
      <div id="signinBtn"></div>
      <div class="userchip" id="userChip">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
        <button class="btn-ghost" onclick="signOut()">登出</button>
      </div>
    </div>
  </header>

  <div class="layout">

    <section class="panel" id="aux">
      <div class="panel-head">
        <h2>輔助區</h2>
        <button class="fold-btn" onclick="toggleFold('aux')">‹</button>
      </div>
      <div class="panel-body" id="logBody">
        <p class="empty-hint">系統歷程將顯示於此</p>
      </div>
    </section>

    <div class="resizer" data-left="aux" data-right="chat"></div>

    <section class="panel" id="chat">
      <div class="panel-head">
        <h2>對話區</h2>
      </div>
      <div class="panel-body" id="chatScroll">
        <div class="bubble ai">歡迎回到 ZIZAI。提出需求，我會依定位、對位、執行、驗證的方式回應。</div>
      </div>
      <div class="chat-input-bar">
        <textarea id="chatInput" placeholder="輸入需求…（Enter 送出，Shift+Enter 換行）"></textarea>
        <button onclick="sendMessage()">送出</button>
      </div>
    </section>

    <div class="resizer" data-left="chat" data-right="view"></div>

    <section class="panel" id="view">
      <div class="panel-head">
        <h2>共視區</h2>
        <button class="fold-btn" onclick="toggleFold('view')">›</button>
      </div>
      <div class="panel-body" id="resultBody">
        <p class="empty-hint">執行成果將顯示於此</p>
      </div>
    </section>

  </div>
</div>

<script>
/* =========================================================
   2.6.1.1 主體中樞現況／歷程 存放位置：Google 雲端硬碟
   4.1.6 資料存取：直接讀寫 Drive，不設本地鏡像／離線佇列
   ========================================================= */
const GOOGLE_CLIENT_ID = "878639442058-igirv988k2peuk91roici2d180ekimqr.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const STATE_FILENAME = "zizai_state.json";

let accessToken = null;
let stateFileId = null;
let tokenClient = null;

/* 現況／歷程 記憶體物件；讀寫皆直接對齊 Drive 上的 STATE_FILENAME */
let zizaiState = {
  現況: { 定位AI: null, 最後更新: null },
  歷程: []
};

window.onload = () => {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredential
  });
  google.accounts.id.renderButton(
    document.getElementById("signinBtn"),
    { theme: "outline", size: "medium", text: "signin", shape: "pill" }
  );

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if (resp.error) { setDriveStatus(false, "授權失敗"); return; }
      accessToken = resp.access_token;
      await loadStateFromDrive();
    }
  });

  makeResizable();
};

/* 登入後同時取得基本身分（顯示用）與 Drive 存取權（讀寫用） */
function handleCredential(resp) {
  const payload = parseJwt(resp.credential);
  document.getElementById("userAvatar").src = payload.picture || "";
  document.getElementById("userName").textContent = payload.name || payload.email || "";
  document.getElementById("userChip").style.display = "flex";
  document.getElementById("signinBtn").style.display = "none";
  tokenClient.requestAccessToken({ prompt: "" });
}

function signOut() {
  accessToken = null;
  stateFileId = null;
  document.getElementById("userChip").style.display = "none";
  document.getElementById("signinBtn").style.display = "block";
  setDriveStatus(false, "雲端未連線");
}

function parseJwt(token) {
  try { return JSON.parse(atob(token.split(".")[1])); } catch (e) { return {}; }
}

function setDriveStatus(ok, label) {
  const dot = document.getElementById("driveDot");
  dot.className = "dot" + (ok ? " on" : "");
  document.getElementById("driveStatus").lastChild.textContent = label;
}

/* ---- Drive 讀寫：找不到就建立一份空的現況／歷程 ---- */
async function loadStateFromDrive() {
  setDriveStatus(false, "同步中…");
  try {
    const q = encodeURIComponent(`name='${STATE_FILENAME}' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
      { headers: { Authorization: `Bearer ${accessToken}` } });
    const listData = await listRes.json();

    if (listData.files && listData.files.length > 0) {
      stateFileId = listData.files[0].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${stateFileId}?alt=media`,
        { headers: { Authorization: `Bearer ${accessToken}` } });
      zizaiState = await fileRes.json();
      addLog("已從 Google 雲端硬碟讀取現況／歷程");
    } else {
      await createStateFile();
      addLog("雲端無現存檔案，已建立新的現況／歷程");
    }
    setDriveStatus(true, "已連線 Google 雲端硬碟");
    renderHistoryToLog();
  } catch (e) {
    setDriveStatus(false, "連線失敗");
    addLog("錯誤：無法連線 Google 雲端硬碟（" + e.message + "）");
  }
}

async function createStateFile() {
  const metadata = { name: STATE_FILENAME, mimeType: "application/json" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", new Blob([JSON.stringify(zizaiState)], { type: "application/json" }));
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { Authorization: `Bearer ${accessToken}` }, body: form });
  const data = await res.json();
  stateFileId = data.id;
}

async function saveStateToDrive() {
  if (!accessToken || !stateFileId) return; // 未連線時不寫入，避免產生孤立狀態
  zizaiState.現況.最後更新 = new Date().toISOString();
  try {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${stateFileId}?uploadType=media`, {
      method: "PATCH",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(zizaiState)
    });
    setDriveStatus(true, "已同步");
  } catch (e) {
    setDriveStatus(false, "同步失敗，將於下次操作重試");
  }
}

function renderHistoryToLog() {
  const body = document.getElementById("logBody");
  if (zizaiState.歷程.length === 0) return;
  body.innerHTML = "";
  zizaiState.歷程.slice(-30).forEach(item => appendLogDom(item.text, item.time));
}

/* =========================================================
   4.1.3 摺疊機制
   ========================================================= */
function toggleFold(id) {
  document.getElementById(id).classList.toggle("collapsed");
}

/* =========================================================
   4.1.4 拖曳調整
   ========================================================= */
function makeResizable() {
  document.querySelectorAll(".resizer").forEach(bar => {
    bar.addEventListener("mousedown", (e) => {
      e.preventDefault();
      bar.classList.add("active");
      const leftEl = document.getElementById(bar.dataset.left);
      const rightEl = document.getElementById(bar.dataset.right);
      const startX = e.clientX;
      const leftStart = leftEl.getBoundingClientRect().width;
      const rightStart = rightEl.getBoundingClientRect().width;

      function onMove(ev) {
        const dx = ev.clientX - startX;
        const newLeft = Math.max(80, leftStart + dx);
        const newRight = Math.max(80, rightStart - dx);
        leftEl.style.flex = `0 0 ${newLeft}px`;
        rightEl.style.flex = rightEl.id === "chat" ? "1 1 auto" : `0 0 ${newRight}px`;
      }
      function onUp() {
        bar.classList.remove("active");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

/* =========================================================
   4.1.5 資料流：sendMessage() 為核心邏輯入口
   1.3 運行模式：需求 → 定位 → 對位 → 執行 → 驗證 → 更新現況/歷程
   ========================================================= */
function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;

  addBubble("user", text);
  addLog("使用者提出需求：" + text);
  input.value = "";

  // 定位／對位／執行 —— 目前為主體UI骨架階段，AI運算單位尚未串接，先回應佔位訊息
  setTimeout(() => {
    const reply = "（尚未串接 AI 運算單位，此為主體UI骨架階段的佔位回應）";
    addBubble("ai", reply);
    addLog("AI執行完成（佔位）");
    addResultCard("需求已記錄", text);

    zizaiState.現況.定位AI = "尚未設定";
    zizaiState.歷程.push({ text: "使用者：" + text, time: new Date().toISOString() });
    saveStateToDrive();
  }, 300);
}

document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addLog(text) {
  const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
  appendLogDom(text, time);
}
function appendLogDom(text, time) {
  const body = document.getElementById("logBody");
  const hint = body.querySelector(".empty-hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "log-item";
  div.innerHTML = `<time>${time}</time>${text}`;
  body.prepend(div);
}

function addBubble(role, text) {
  const scroll = document.getElementById("chatScroll");
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.textContent = text;
  scroll.appendChild(div);
  scroll.parentElement.scrollTop = scroll.parentElement.scrollHeight;
}

function addResultCard(title, detail) {
  const body = document.getElementById("resultBody");
  const hint = body.querySelector(".empty-hint");
  if (hint) hint.remove();
  const card = document.createElement("div");
  card.className = "result-card";
  card.innerHTML = `<h3>${title}</h3><p>${detail}</p>`;
  body.prepend(card);
}
</script>
</body>
</html>
