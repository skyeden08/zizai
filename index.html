<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIZAI · 主體</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F6F63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F6F4EE;
    --paper-dim:#EDEAE1;
    --panel:#FBFAF6;
    --ink:#23262B;
    --ink-soft:#6B6F76;
    --line:#D9D4C7;
    --jade:#3F6F63;
    --jade-dim:#E4ECE9;
    --jade-deep:#2C544B;
    --warn:#B5542D;
    --serif:'Noto Serif TC', serif;
    --sans:'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    height:52px;
    flex:0 0 auto;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-family:var(--serif); font-weight:700; font-size:18px; letter-spacing:.02em; }
  .brand .tag{ font-size:12px; color:var(--ink-soft); }
  .status{ display:flex; align-items:center; gap:14px; font-size:12px; color:var(--ink-soft); }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); display:inline-block; margin-right:5px; }
  .status .dot.on{ background:var(--jade); }
  .status .dot.err{ background:var(--warn); }
  #signinBtn{ display:flex; align-items:center; }
  .userchip{ display:none; align-items:center; gap:8px; font-size:12px; }
  .userchip img{ width:22px; height:22px; border-radius:50%; }
  .btn-ghost{ border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-family:var(--sans); font-size:12px; padding:5px 10px; border-radius:3px; cursor:pointer; }
  .btn-ghost:hover{ border-color:var(--jade); color:var(--jade-deep); }
  .layout{ flex:1 1 auto; display:flex; min-height:0; }
  .panel{ display:flex; flex-direction:column; min-width:0; overflow:hidden; transition:flex-basis .15s ease; }
  .panel-head{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); }
  .panel-head h2{ font-family:var(--serif); font-size:13px; font-weight:600; color:var(--ink); letter-spacing:.03em; }
  .fold-btn{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13px; line-height:1; padding:2px 4px; }
  .fold-btn:hover{ color:var(--jade-deep); }
  .panel-body{ flex:1 1 auto; overflow-y:auto; padding:14px 16px; }
  #aux{ flex:0 0 240px; background:var(--paper-dim); }
  #chat{ flex:1 1 auto; background:var(--paper); border-left:1px solid var(--line); border-right:1px solid var(--line); }
  #view{ flex:0 0 320px; background:var(--paper-dim); }
  .panel.collapsed{ flex:0 0 40px !important; }
  .panel.collapsed .panel-body{ display:none; }
  .panel.collapsed .panel-head h2{ display:none; }
  .panel.collapsed .panel-head{ justify-content:center; }
  .resizer{ flex:0 0 5px; cursor:col-resize; background:transparent; position:relative; }
  .resizer::after{ content:''; position:absolute; top:0; bottom:0; left:2px; width:1px; background:var(--line); }
  .resizer:hover::after, .resizer.active::after{ background:var(--jade); width:2px; left:1.5px;}
  .log-item{ font-size:11px; color:var(--ink-soft); line-height:1.6; padding:6px 0; border-bottom:1px dashed var(--line); }
  .log-item time{ display:block; font-size:10px; color:#9A968A; }
  #collabOption{ position:sticky; top:0; z-index:2; }
  .aux-option{ margin-bottom:8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); overflow:hidden; }
  .aux-option-head{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; cursor:pointer; font-size:12px; font-weight:500; color:var(--ink); user-select:none; }
  .aux-option-head:hover{ background:var(--jade-dim); }
  .aux-option-head .opt-arrow{ font-size:11px; color:var(--ink-soft); transition:transform .15s ease; }
  .aux-option.open .opt-arrow{ transform:rotate(90deg); }
  .aux-option-body{ display:none; padding:6px 10px 10px; border-top:1px solid var(--line); }
  .aux-option.open .aux-option-body{ display:block; }
  .ai-status-list{ list-style:none; }
  .ai-status-list li{ display:flex; align-items:center; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--ink-soft); }
  .ai-status-list .ai-name{ font-weight:500; color:var(--ink); }
  .ai-status-list .ai-state{ font-size:11px; }
  .ai-status-list .ai-state.on{ color:var(--jade-deep); }
  .ai-status-list .ai-state.off{ color:#A8A398; }
  #chatScroll{ display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:8px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
  .bubble.user{ align-self:flex-end; background:var(--jade); color:#fff; border-bottom-right-radius:2px; }
  .bubble.ai{ align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:2px; }
  .chat-input-bar{ flex:0 0 auto; display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  .chat-input-bar textarea{ flex:1; resize:none; height:42px; font-family:var(--sans); font-size:13.5px; border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:var(--paper); color:var(--ink); }
  .chat-input-bar textarea:focus{ outline:none; border-color:var(--jade); }
  .chat-input-bar button{ font-family:var(--sans); font-weight:500; font-size:13px; background:var(--jade); color:#fff; border:none; border-radius:6px; padding:0 18px; cursor:pointer; }
  .chat-input-bar button:hover{ background:var(--jade-deep); }
  .result-card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; }
  .result-card h3{ font-family:var(--serif); font-size:12.5px; font-weight:600; margin-bottom:5px; }
  .result-card p{ font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .topic-widget{ position:relative; }
  .topic-toggle{ display:flex; align-items:center; gap:6px; font-family:var(--sans); font-size:12px; color:var(--ink-soft); background:transparent; border:1px solid var(--line); border-radius:20px; padding:5px 12px; cursor:pointer; }
  .topic-toggle:hover{ border-color:var(--jade); color:var(--jade-deep); }
  .topic-toggle #topicBadge{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topic-toggle .opt-arrow{ transform:rotate(90deg); transition:transform .15s ease; }
  .topic-widget.open .topic-toggle .opt-arrow{ transform:rotate(270deg); }
  .topic-widget.open .topic-toggle{ border-color:var(--jade); color:var(--jade-deep); }
  .topic-dropdown{ display:none; position:absolute; top:calc(100% + 6px); right:0; width:240px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:0 6px 18px rgba(35,38,43,.12); z-index:10; }
  .topic-widget.open .topic-dropdown{ display:block; }
  .topic-input{ width:100%; font-family:var(--sans); font-size:12px; border:1px solid var(--line); border-radius:5px; padding:7px 9px; background:var(--paper); color:var(--ink); margin-bottom:8px; }
  .topic-input:focus{ outline:none; border-color:var(--jade); }
  .topic-history{ display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto; }
  .topic-chip{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; padding:5px 8px; border-radius:4px; background:var(--paper); border:1px solid var(--line); cursor:pointer; color:var(--ink-soft); }
  .topic-chip:hover{ border-color:var(--jade); color:var(--jade-deep); }
  .topic-chip.current{ background:var(--jade-dim); border-color:var(--jade); color:var(--jade-deep); font-weight:500; }
  .empty-hint{ font-size:12px; color:#A8A398; text-align:center; padding:30px 10px; line-height:1.8; }
  ::-webkit-scrollbar{ width:7px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  @media (max-width:760px){ #aux, #view{ display:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">ZIZAI</span>
      <span class="tag">主體 · 自在</span>
    </div>
    <div class="status">
      <span id="githubStatus"><span class="dot" id="githubDot"></span>尚未登入</span>
      <span id="driveStatus"><span class="dot" id="driveDot"></span>備份未連線</span>
      <div id="signinBtn"></div>
      <div class="userchip" id="userChip">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
        <button class="btn-ghost" id="connectDriveBtn" style="display:none;" onclick="connectDrive()">連接密鑰／備份</button>
        <button class="btn-ghost" onclick="signOut()">登出</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <section class="panel" id="aux">
      <div class="panel-head">
        <h2>輔助區</h2>
        <button class="fold-btn" onclick="toggleFold('aux')">‹</button>
      </div>
      <div class="panel-body" id="logBody">
        <div class="aux-option" id="collabOption">
          <div class="aux-option-head" onclick="toggleAuxOption('collabOption')">
            <span>協作</span>
            <span class="opt-arrow">›</span>
          </div>
          <div class="aux-option-body">
            <ul class="ai-status-list">
              <li><span class="ai-name">Grok</span><span class="ai-state on">已接入</span></li>
              <li><span class="ai-name">Claude</span><span class="ai-state off">未接入</span></li>
              <li><span class="ai-name">ChatGPT</span><span class="ai-state off">未接入</span></li>
              <li><span class="ai-name">Gemini</span><span class="ai-state off" id="geminiStatus">未接入</span></li>
            </ul>
          </div>
        </div>
        <div class="aux-option" id="historyOption">
          <div class="aux-option-head" onclick="toggleAuxOption('historyOption')">
            <span>流水帳</span>
            <span class="opt-arrow">›</span>
          </div>
          <div class="aux-option-body">
            <div id="historyList">
              <p class="empty-hint">系統歷程將顯示於此</p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="resizer" data-left="aux" data-right="chat"></div>
    <section class="panel" id="chat">
      <div class="panel-head">
        <h2>對話區</h2>
        <div class="topic-widget" id="topicWidget">
          <button class="topic-toggle" id="topicToggle" onclick="toggleTopicDropdown(event)">
            <span id="topicBadge">設定主題</span>
            <span class="opt-arrow" id="topicArrow">›</span>
          </button>
          <div class="topic-dropdown" id="topicDropdown">
            <input type="text" id="topicInput" class="topic-input" placeholder="輸入目前對話主題，按 Enter 標記…">
            <div id="topicHistoryList" class="topic-history"></div>
          </div>
        </div>
      </div>
      <div class="panel-body" id="chatScroll">
        <div class="bubble ai">歡迎回到 ZIZAI。提出需求，我會依定位、對位、執行、驗證的方式回應。</div>
      </div>
      <div class="chat-input-bar">
        <textarea id="chatInput" placeholder="輸入需求…（Enter 送出，Shift+Enter 換行）"></textarea>
        <button onclick="sendMessage()">送出</button>
      </div>
    </section>
    <div class="resizer" data-left="chat" data-right="view"></div>
    <section class="panel" id="view">
      <div class="panel-head">
        <h2>共視區</h2>
        <button class="fold-btn" onclick="toggleFold('view')">›</button>
      </div>
      <div class="panel-body" id="resultBody">
        <p class="empty-hint">執行成果將顯示於此</p>
      </div>
    </section>
  </div>
</div>
<script>
const GITHUB_REPO = "skyeden08/zizai";
const GITHUB_PATH = "zizai_state.json";
const GITHUB_API = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
const TOKEN_FILENAME = "zizai_github_token.json";
const GEMINI_KEY_FILENAME = "zizai_gemini_key.json";
const GOOGLE_CLIENT_ID = "878639442058-igirv988k2peuk91roici2d180ekimqr.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const STATE_FILENAME = "zizai_state.json";
let accessToken = null;
let stateFileId = null;
let tokenClient = null;
let githubSha = null;
let githubToken = null;
let geminiKey = null;
let isSilentDriveCheck = false;
let tokenExpiryTimer = null;
let zizaiState = { 現況: { 定位AI: null, 最後更新: null }, 歷程: [], 主題: { 目前: "", 歷史: [] } };
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
window.onload = () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  setGithubStatus(false, "請登入以讀取密鑰");
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredential, auto_select: true });
  google.accounts.id.renderButton(document.getElementById("signinBtn"), { theme: "outline", size: "medium", text: "signin", shape: "pill" });
  google.accounts.id.prompt();
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
    callback: async (resp) => {
      const wasSilent = isSilentDriveCheck;
      isSilentDriveCheck = false;
      if (resp.error) { if (!wasSilent) setDriveStatus(false, "授權失敗"); return; }
      accessToken = resp.access_token;
      scheduleTokenRefresh(resp.expires_in);
      document.getElementById("connectDriveBtn").style.display = "none";
      await loadGithubTokenFromDrive();
      await loadGeminiKeyFromDrive();
      await loadDriveFileId();
    }
  });
  isSilentDriveCheck = true;
  tokenClient.requestAccessToken({ prompt: "" });
  makeResizable();
};
function scheduleTokenRefresh(expiresInSec) {
  if (tokenExpiryTimer) clearTimeout(tokenExpiryTimer);
  const sec = parseInt(expiresInSec, 10) || 3300;
  const refreshMs = Math.max(30000, (sec - 300) * 1000);
  tokenExpiryTimer = setTimeout(() => {
    isSilentDriveCheck = true;
    tokenClient.requestAccessToken({ prompt: "" });
  }, refreshMs);
}
function handleCredential(resp) {
  const payload = parseJwt(resp.credential);
  document.getElementById("userAvatar").src = payload.picture || "";
  document.getElementById("userName").textContent = payload.name || payload.email || "";
  document.getElementById("userChip").style.display = "flex";
  document.getElementById("signinBtn").style.display = "none";
  if (!accessToken) document.getElementById("connectDriveBtn").style.display = "inline-block";
}
function connectDrive() { isSilentDriveCheck = false; tokenClient.requestAccessToken({ prompt: "consent" }); }
function signOut() {
  if (tokenExpiryTimer) { clearTimeout(tokenExpiryTimer); tokenExpiryTimer = null; }
  accessToken = null; stateFileId = null; githubToken = null; geminiKey = null;
  updateGeminiStatusUI();
  document.getElementById("userChip").style.display = "none";
  document.getElementById("signinBtn").style.display = "block";
  setDriveStatus(false, "備份未連線");
  setGithubStatus(false, "請登入以讀取密鑰");
}
function parseJwt(token) {
  try {
    const base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    const jsonPayload = decodeURIComponent(atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(jsonPayload);
  } catch (e) { return {}; }
}
function setDriveStatus(ok, label) {
  const dot = document.getElementById("driveDot");
  dot.className = "dot" + (ok ? " on" : "");
  document.getElementById("driveStatus").lastChild.textContent = label;
}
function setGithubStatus(ok, label) {
  const dot = document.getElementById("githubDot");
  dot.className = "dot" + (ok ? " on" : "");
  document.getElementById("githubStatus").lastChild.textContent = label;
}
async function loadGithubTokenFromDrive() {
  setGithubStatus(false, "讀取密鑰中…");
  try {
    const q = encodeURIComponent(`name='${TOKEN_FILENAME}' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: { Authorization: `Bearer ${accessToken}` } });
    const listData = await listRes.json();
    if (listData.files && listData.files.length > 0) {
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${listData.files[0].id}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
      const data = await fileRes.json();
      githubToken = data.token;
    } else {
      const input = window.prompt("首次設定：請貼上你的 GitHub Personal Access Token\n（僅會存入你自己的 Google 雲端硬碟，不會進入 GitHub 倉庫）");
      if (!input) { setGithubStatus(false, "尚未設定密鑰"); return; }
      githubToken = input.trim();
      await saveGithubTokenToDrive(githubToken);
    }
    await loadStateFromGitHub();
  } catch (e) { setGithubStatus(false, "密鑰讀取失敗"); }
}
async function saveGithubTokenToDrive(token) {
  const metadata = { name: TOKEN_FILENAME, mimeType: "application/json" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", new Blob([JSON.stringify({ token })], { type: "application/json" }));
  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { Authorization: `Bearer ${accessToken}` }, body: form });
}
async function loadGeminiKeyFromDrive() {
  try {
    const q = encodeURIComponent(`name='${GEMINI_KEY_FILENAME}' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: { Authorization: `Bearer ${accessToken}` } });
    const listData = await listRes.json();
    if (listData.files && listData.files.length > 0) {
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${listData.files[0].id}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
      const data = await fileRes.json();
      geminiKey = data.key;
    } else {
      const input = window.prompt("首次設定：請貼上你的 Gemini API Key\n（僅會存入你自己的 Google 雲端硬碟，不會進入 GitHub 倉庫）");
      if (!input) { updateGeminiStatusUI(); return; }
      geminiKey = input.trim();
      await saveGeminiKeyToDrive(geminiKey);
    }
    updateGeminiStatusUI();
  } catch (e) {
    geminiKey = null;
    updateGeminiStatusUI();
    addLog("Gemini 密鑰讀取失敗");
  }
}
async function saveGeminiKeyToDrive(key) {
  const metadata = { name: GEMINI_KEY_FILENAME, mimeType: "application/json" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", new Blob([JSON.stringify({ key })], { type: "application/json" }));
  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { Authorization: `Bearer ${accessToken}` }, body: form });
}
function updateGeminiStatusUI() {
  const el = document.getElementById("geminiStatus");
  if (!el) return;
  if (geminiKey) { el.textContent = "已接入"; el.className = "ai-state on"; }
  else { el.textContent = "未接入"; el.className = "ai-state off"; }
}
async function loadStateFromGitHub() {
  if (!githubToken) { setGithubStatus(false, "尚未設定密鑰"); return; }
  try {
    const res = await fetch(GITHUB_API, { headers: { Authorization: `token ${githubToken}` } });
    if (res.status === 200) {
      const data = await res.json();
      githubSha = data.sha;
      zizaiState = JSON.parse(base64ToUtf8(data.content));
      if (!zizaiState.主題) zizaiState.主題 = { 目前: "", 歷史: [] };
      addLog("已從 GitHub 讀取現況／歷程");
    } else if (res.status === 404) {
      await saveStateToGitHub();
      addLog("GitHub無現存檔案，已建立新的現況／歷程");
    } else if (res.status === 401) { throw new Error("密鑰無效或已被撤銷，請重新設定"); }
    else { throw new Error("HTTP " + res.status); }
    setGithubStatus(true, "GitHub正常");
    renderHistoryToLog();
    renderTopicUI();
  } catch (e) {
    setGithubStatus(false, "GitHub連線失敗");
    addLog("錯誤：無法連線 GitHub（" + e.message + "）");
  }
}
async function saveStateToGitHub() {
  if (!githubToken) return;
  zizaiState.現況.最後更新 = new Date().toISOString();
  try {
    const body = { message: "更新現況／歷程 " + new Date().toISOString(), content: utf8ToBase64(JSON.stringify(zizaiState, null, 2)) };
    if (githubSha) body.sha = githubSha;
    const res = await fetch(GITHUB_API, { method: "PUT", headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.content) githubSha = data.content.sha;
    setGithubStatus(true, "已寫入GitHub");
  } catch (e) { setGithubStatus(false, "寫入失敗，將於下次操作重試"); }
}
async function loadDriveFileId() {
  setDriveStatus(false, "連接中…");
  try {
    const q = encodeURIComponent(`name='${STATE_FILENAME}' and trashed=false`);
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: { Authorization: `Bearer ${accessToken}` } });
    const listData = await listRes.json();
    if (listData.files && listData.files.length > 0) stateFileId = listData.files[0].id;
    else await createDriveBackupFile();
    setDriveStatus(true, "備份已連線");
    document.getElementById("connectDriveBtn").style.display = "none";
    await backupToDrive();
  } catch (e) { setDriveStatus(false, "備份連線失敗"); }
}
async function createDriveBackupFile() {
  const metadata = { name: STATE_FILENAME, mimeType: "application/json" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", new Blob([JSON.stringify(zizaiState)], { type: "application/json" }));
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { Authorization: `Bearer ${accessToken}` }, body: form });
  const data = await res.json();
  stateFileId = data.id;
}
async function backupToDrive() {
  if (!accessToken || !stateFileId) return;
  try {
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${stateFileId}?uploadType=media`, { method: "PATCH", headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(zizaiState) });
  } catch (e) {}
}
function renderHistoryToLog() {
  if (!zizaiState.歷程 || !zizaiState.歷程.length) return;
  zizaiState.歷程.slice().reverse().forEach(item => {
    appendLogDom(item.text || JSON.stringify(item), item.time ? new Date(item.time).toLocaleTimeString("zh-TW", { hour12: false }) : "");
  });
}
function setTopic(name) {
  name = (name || "").trim();
  if (!name) return;
  if (!zizaiState.主題) zizaiState.主題 = { 目前: "", 歷史: [] };
  zizaiState.主題.目前 = name;
  zizaiState.主題.歷史 = zizaiState.主題.歷史.filter(t => t !== name);
  zizaiState.主題.歷史.unshift(name);
  if (zizaiState.主題.歷史.length > 20) zizaiState.主題.歷史.length = 20;
  renderTopicUI();
  document.getElementById("topicInput").value = "";
  document.getElementById("topicWidget").classList.remove("open");
  saveStateToGitHub().then(() => backupToDrive());
}
function renderTopicUI() {
  const t = zizaiState.主題 || { 目前: "", 歷史: [] };
  document.getElementById("topicBadge").textContent = t.目前 || "設定主題";
  const list = document.getElementById("topicHistoryList");
  list.innerHTML = "";
  if (!t.歷史.length) { list.innerHTML = '<p class="empty-hint">尚無主題紀錄</p>'; return; }
  t.歷史.forEach(name => {
    const chip = document.createElement("div");
    chip.className = "topic-chip" + (name === t.目前 ? " current" : "");
    chip.textContent = name;
    chip.onclick = () => setTopic(name);
    list.appendChild(chip);
  });
}
function toggleTopicDropdown(e) {
  if (e) e.stopPropagation();
  document.getElementById("topicWidget").classList.toggle("open");
}
document.addEventListener("click", (e) => {
  const widget = document.getElementById("topicWidget");
  if (widget && widget.classList.contains("open") && !widget.contains(e.target)) {
    widget.classList.remove("open");
  }
});
document.getElementById("topicInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); setTopic(e.target.value); }
  e.stopPropagation();
});
function toggleAuxOption(id) { document.getElementById(id).classList.toggle("open"); }
function toggleFold(id) { document.getElementById(id).classList.toggle("collapsed"); }
function makeResizable() {
  document.querySelectorAll(".resizer").forEach(bar => {
    bar.addEventListener("mousedown", e => {
      e.preventDefault();
      bar.classList.add("active");
      const leftEl = document.getElementById(bar.dataset.left);
      const rightEl = document.getElementById(bar.dataset.right);
      const startX = e.clientX;
      const startLeft = leftEl.getBoundingClientRect().width;
      const startRight = rightEl.getBoundingClientRect().width;
      function onMove(ev) {
        const dx = ev.clientX - startX;
        leftEl.style.flex = `0 0 ${Math.max(40, startLeft + dx)}px`;
        rightEl.style.flex = rightEl.id === "chat" ? "1 1 auto" : `0 0 ${Math.max(40, startRight - dx)}px`;
      }
      function onUp() {
        bar.classList.remove("active");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}
async function callGemini(conversationHistory) {
  if (!geminiKey) return "尚未設定 Gemini API Key，請先登入並連接密鑰";
  try {
    const contents = conversationHistory.map(item => {
      const role = (item.role === "model" || item.role === "ai" || item.role === "assistant") ? "model" : "user";
      return { role, parts: [{ text: item.text || "" }] };
    });
    if (contents.length && contents[0].role !== "user") {
      contents.unshift({ role: "user", parts: [{ text: "（系統）請依 ZIZAI 定位、對位、執行、驗證方式回應。" }] });
    }
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(geminiKey)}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents })
    });
    if (!res.ok) {
      const errText = await res.text();
      return `Gemini API 錯誤（${res.status}）：${errText.slice(0, 200)}`;
    }
    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!reply) return "Gemini 未回傳有效內容";
    return reply;
  } catch (e) { return "Gemini 呼叫失敗：" + (e.message || String(e)); }
}
async function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  addBubble("user", text);
  addLog("使用者提出需求：" + text);
  input.value = "";
  const conversationHistory = [];
  if (Array.isArray(zizaiState.歷程)) {
    zizaiState.歷程.forEach(item => {
      const t = item.text || "";
      if (t.startsWith("使用者：")) conversationHistory.push({ role: "user", text: t.replace(/^使用者：/, "") });
      else if (t.startsWith("AI：") || t.startsWith("Gemini：")) conversationHistory.push({ role: "model", text: t.replace(/^(AI|Gemini)：/, "") });
      else if (item.role === "user" || item.role === "model") conversationHistory.push({ role: item.role === "model" ? "model" : "user", text: t });
    });
  }
  conversationHistory.push({ role: "user", text: text });
  let reply;
  if (!geminiKey) reply = "尚未設定 Gemini API Key，請先登入並連接密鑰";
  else { addLog("正在呼叫 Gemini…"); reply = await callGemini(conversationHistory); }
  addBubble("ai", reply);
  addLog("Gemini 回應完成");
  addResultCard("Gemini 回應", reply.slice(0, 200) + (reply.length > 200 ? "…" : ""));
  zizaiState.現況.定位AI = geminiKey ? "Gemini" : "尚未設定";
  zizaiState.歷程.push({ text: "使用者：" + text, time: new Date().toISOString(), role: "user" });
  zizaiState.歷程.push({ text: "Gemini：" + reply, time: new Date().toISOString(), role: "model" });
  saveStateToGitHub().then(() => backupToDrive());
}
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
function addLog(text) {
  const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
  appendLogDom(text, time);
}
function appendLogDom(text, time) {
  const body = document.getElementById("historyList");
  const hint = body.querySelector(".empty-hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "log-item";
  div.innerHTML = `<time>${time}</time>${text}`;
  body.prepend(div);
}
function addBubble(role, text) {
  const scroll = document.getElementById("chatScroll");
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.textContent = text;
  scroll.appendChild(div);
  scroll.parentElement.scrollTop = scroll.parentElement.scrollHeight;
}
function addResultCard(title, detail) {
  const body = document.getElementById("resultBody");
  const hint = body.querySelector(".empty-hint");
  if (hint) hint.remove();
  const card = document.createElement("div");
  card.className = "result-card";
  card.innerHTML = `<h3>${title}</h3><p>${detail}</p>`;
  body.prepend(card);
}
</script>
</body>
